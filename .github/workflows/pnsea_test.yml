name: pnsea-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pnsea
      - run: |
          python - <<'EOF'
          from pnsea import NSE
          try:
              nse = NSE()
              df = nse.options.option_chain("NIFTY")
              print(type(df))
              print(df)
          except Exception as e:
              print("ERROR:", repr(e))
          EOF
