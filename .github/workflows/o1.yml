name: o1-mota-bhai

on:
  schedule:
    - cron: "*/10 4-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: o1
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add trades_o1.json || true
          git commit -m "update o1" || echo "nothing to commit"
          git push || true
